# 把所有 HTTP 请求强制跳转到 HTTPS
server {
    listen 80;
    server_name webjianghuzhi.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主配置，代理到你的 Next.js 服务
server {
    listen 443 ssl;
    server_name webjianghuzhi.com;

    # SSL 证书路径（容器内的路径，和 docker-compose.yml 里的挂载对应）
    ssl_certificate /etc/nginx/ssl/live/webjianghuzhi.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/webjianghuzhi.com/privkey.pem;

    # 基础 SSL 配置（提升安全性）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}