name: Build & Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 👇 这一段我专门给你写的，解决中文用户名登录失败
      - name: Login to Aliyun ACR
        run: |
          echo "${{ secrets.ALIYUN_PWD }}" | docker login crpi-vde8ua5gvkrisac8.cn-hangzhou.personal.cr.aliyuncs.com -u "猩崽大叔" --password-stdin

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: crpi-vde8ua5gvkrisac8.cn-hangzhou.personal.cr.aliyuncs.com/unclexing_blog/next-app:latest

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/webblog
            docker compose pull
            docker compose up -d