name: Build & Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 👇 这是专门给你写的、最稳定的登录方式
      - name: Login to Aliyun ACR
        run: |
          docker login crpi-vde8ua5gvkrisac8.cn-hangzhou.personal.cr.aliyuncs.com \
            -u "猩崽大叔" \
            -p "${{ secrets.ALIYUN_PWD }}"

      # 👇 构建并推送到阿里云
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: crpi-vde8ua5gvkrisac8.cn-hangzhou.personal.cr.aliyuncs.com/unclexing_blog/next-app:latest

      # 👇 登录服务器并更新
      
      - name: Install SSH Client
        run: sudo apt-get install -y openssh-client

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/webblog
            docker compose pull
            docker compose up -d