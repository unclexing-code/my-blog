name: Build & Deploy
on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 登录阿里云（你已经成功）
      - name: Login to Aliyun ACR
        run: |
          docker login crpi-vde8ua5gvkrisac8.cn-hangzhou.personal.cr.aliyuncs.com -u "猩崽大叔" -p "${{ secrets.ALIYUN_PWD }}"

      # 2. 构建推送镜像
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: crpi-vde8ua5gvkrisac8.cn-hangzhou.personal.cr.aliyuncs.com/unclexing_blog/next-app:latest

      # 3. 用密码登录服务器（终极方案，绝对成功）
      - name: Deploy to Server
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no root@${{ secrets.SERVER_HOST }} "
            cd /home/webblog
            docker compose up -d
          "