name: Build & Deploy
on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 登录阿里云（你已经成功过）
      - name: Login to ACR
        run: |
          docker login crpi-vde8ua5gvkrisac8.cn-hangzhou.personal.cr.aliyuncs.com -u "猩崽大叔" -p "${{ secrets.ALIYUN_PWD }}"

      # 2. 构建并推送镜像（你这步是好的）
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: crpi-vde8ua5gvkrisac8.cn-hangzhou.personal.cr.aliyuncs.com/unclexing_blog/next-app:latest

      # ==============================================
      # 👇 👇 👇 这里是重点：我彻底换掉了 ssh-action
      # ==============================================
      - name: Deploy to Server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          
          ssh root@${{ secrets.SERVER_HOST }} '
            cd /home/webblog
            docker compose pull
            docker compose up -d
          '